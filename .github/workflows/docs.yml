name: Build and deploy docs

on:
  push:
    branches:
      - develop

jobs:
  github-pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: ./docs
      - run: npm run build
        working-directory: ./docs
      # `kefranabg/s3-sync-action` was an abandoned fork pinned to a 2020
      # commit. Replace with the official AWS credentials action + native
      # `aws s3 sync` so we stay on maintained tooling.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1
      - name: Sync docs to S3
        run: |
          aws s3 sync docs/build "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --follow-symlinks --delete
      - name: Invalidate CloudFront cache
        if: ${{ secrets.DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.DISTRIBUTION_ID }}" \
            --paths '/*'
