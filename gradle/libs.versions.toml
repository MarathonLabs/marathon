[versions]
kotlin = "2.1.20"
coroutines = "1.11.0"
androidCommon = "31.6.1"
adam = "0.5.8"
dexTestParser = "2.3.4"
kotlinLogging = "3.0.5"
logbackClassic = "1.5.8"
axmlParser = "1.0"
bugsnag = "3.7.2"
junit5 = "5.11.0"
# JUnit 5.8+ split the platform launcher out; Gradle 9 test workers no longer
# resolve it transitively.
junitPlatform = "1.11.0"
kluent = "1.73"
gson = "2.11.0"
apacheCommonsText = "1.12.0"
apacheCommonsIO = "2.17.0"
okhttp = "4.12.0"
ktor = "2.3.6"
influxDbClient = "2.24"
influxDb2Client = "7.2.0"
clikt = "5.0.0"
jackson = "2.17.2"
ddPlist = "1.28"
guava = "33.3.0-jre"
rsync4j = "3.3.0-1"
sshj = "0.39.0"
kotlinProcess = "1.5"
testContainers = "1.20.1"
jansi = "2.4.1"
scalr = "4.2"
allureTestFilter = "2.29.0"
allureJava = "2.29.0"
allureKotlin = "2.4.0"
allureEnvironment = "1.0.0"
mockitoKotlin = "5.4.0"
dokka = "2.0.0"
koin = "3.5.6"
jsonAssert = "1.5.3"
xmlUnit = "2.10.0"
assertk = "0.28.1"
buildconfig = "5.5.0"
detekt = "1.23.7"
benManesVersions = "0.51.0"
foojayResolver = "1.0.0"
nodeGradle = "7.1.0"

[libraries]
adam = { module = "com.malinskiy.adam:adam", version.ref = "adam" }
adamTestrunnerContract = { module = "com.malinskiy.adam:android-testrunner-contract", version.ref = "adam" }
androidCommon = { module = "com.android.tools:common", version.ref = "androidCommon" }
dexTestParser = { module = "com.linkedin.dextestparser:parser", version.ref = "dexTestParser" }
kotlinStdLib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinStdLibCommon = { module = "org.jetbrains.kotlin:kotlin-stdlib-common", version.ref = "kotlin" }
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinLogging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlinLogging" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logbackClassic" }
kotlinCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
axmlParser = { module = "com.shazam:axmlparser", version.ref = "axmlParser" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
apacheCommonsText = { module = "org.apache.commons:commons-text", version.ref = "apacheCommonsText" }
apacheCommonsIO = { module = "commons-io:commons-io", version.ref = "apacheCommonsIO" }
influxDbClient = { module = "org.influxdb:influxdb-java", version.ref = "influxDbClient" }
influxDb2Client = { module = "com.influxdb:influxdb-client-java", version.ref = "influxDb2Client" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jacksonAnnotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jacksonKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jacksonYaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jacksonJSR310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
ddPlist = { module = "com.googlecode.plist:dd-plist", version.ref = "ddPlist" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
rsync4j = { module = "com.github.fracpete:rsync4j-all", version.ref = "rsync4j" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
jansi = { module = "org.fusesource.jansi:jansi", version.ref = "jansi" }
scalr = { module = "org.imgscalr:imgscalr-lib", version.ref = "scalr" }
allure = { module = "io.qameta.allure:allure-java-commons", version.ref = "allureJava" }
allureEnvironment = { module = "com.github.automatedowl:allure-environment-writer", version.ref = "allureEnvironment" }
allureKotlinCommons = { module = "io.qameta.allure:allure-kotlin-commons", version.ref = "allureKotlin" }
allureTestFilter = { module = "io.qameta.allure:allure-test-filter", version.ref = "allureTestFilter" }
koin = { module = "io.insert-koin:koin-core", version.ref = "koin" }
bugsnag = { module = "com.bugsnag:bugsnag", version.ref = "bugsnag" }
kotlinProcess = { module = "com.github.pgreze:kotlin-process", version.ref = "kotlinProcess" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ktorNetwork = { module = "io.ktor:ktor-network", version.ref = "ktor" }

# Test libraries
junit5 = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
kluent = { module = "org.amshove.kluent:kluent", version.ref = "kluent" }
mockitoKotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
jupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
koinTest = { module = "io.insert-koin:koin-test", version.ref = "koin" }
jsonAssert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonAssert" }
xmlUnit = { module = "org.xmlunit:xmlunit-matchers", version.ref = "xmlUnit" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
testContainers = { module = "org.testcontainers:testcontainers", version.ref = "testContainers" }
testContainersJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testContainers" }
testContainersInflux = { module = "org.testcontainers:influxdb", version.ref = "testContainers" }
adamServerStubJunit5 = { module = "com.malinskiy.adam:server-stub-junit5", version.ref = "adam" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
benManesVersions = { id = "com.github.ben-manes.versions", version.ref = "benManesVersions" }
foojayResolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
node = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
