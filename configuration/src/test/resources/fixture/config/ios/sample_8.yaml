name: "sample-app tests"
outputDir: "./marathon"
vendorConfiguration:
  type: "iOS"
  bundle:
    derivedDataDir: "derivedDataDir"
  permissions:
    lifecycle: BEFORE_TEST_RUN
    grant:
      - contacts
    applications:
      com.apple.Maps:
        grant:
          - location
      com.example.companion:
        grant:
          - microphone
